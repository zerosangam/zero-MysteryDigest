name: MysteryDigest Daily (LEGACY v1 — Disabled)

# ═══════════════════════════════════════════════════════════
# This is the ORIGINAL v1 workflow, preserved for reference.
# Daily emails are now DISABLED. Emails only go out on Sunday.
# The active workflows are:
#   - research-cycle.yml (every 30 min, Mon-Sat)
#   - daily-lockin.yml (11:59 PM IST, Mon-Sat)
#   - sunday-email.yml (Sunday 06:00 AM IST — the ONLY email)
# ═══════════════════════════════════════════════════════════

on:
  # schedule REMOVED — no more daily emails
  workflow_dispatch: # Keep manual trigger for backward-compat testing

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: sent_cache.json
          key: mystery-cache-${{ github.run_number }}
          restore-keys: |
            mystery-cache-

      - name: Run MysteryDigest (Legacy v1)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py --test

      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sent_cache.json
          key: mystery-cache-${{ github.run_number }}
