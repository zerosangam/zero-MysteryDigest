name: MysteryDigest Daily Lock-In

on:
  schedule:
    # 11:59 PM IST = 18:29 UTC, Monday through Saturday
    - cron: '29 18 * * 1-6'
  workflow_dispatch:

jobs:
  daily-lockin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: data/
          key: mystery-data-${{ github.run_number }}
          restore-keys: |
            mystery-data-

      - name: Run daily lock-in
        run: python main.py --daily-lock

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: mystery-data-${{ github.run_number }}
